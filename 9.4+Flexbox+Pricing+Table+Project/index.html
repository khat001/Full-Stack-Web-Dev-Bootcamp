<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: "Sono", sans-serif;
      }

      .pricing-container{
        display:flex;
        justify-content:center;
        align-items: center;
        height: 100vh;
        gap:2rem;
      }
      .pricing-plan{
        flex: 1;
        max-width:400px;
        padding:20px;
        background-color: whitesmoke;
        padding:15px;
        text-align:center;
        border-radius:10px;
      }
      
      .plan-title{
        font-size:24px;
        font-weight:bold;
        margin-bottom:10px;
      }

      .plan-price{
        font-size:48px;
        font-weight: bold;
        margin-bottom:10px;
      }

      .plan-features{
        list-style:none;
        margin: 0;
        padding:0;
      }
      
      .plan-features li{
        margin-bottom:20px;
      }

      .plan-button{
        background-color:orangered;
        border-radius: 5px;
        border:none;
        color:white;
        padding:10px;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction: column;
          height:100%;
        }
      }
    </style>


  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
